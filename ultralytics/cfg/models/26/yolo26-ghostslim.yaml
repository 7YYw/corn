# YOLO26-GhostSlim: lightweight object detection model with GhostConv and SlimNeck
# Modifications:
#   1. Backbone: Conv → GhostConv (layers 3,5,7), C3k2 → C3k2Ghost (layers 2,4,6,8)
#   2. Neck: C3k2 → VoVGSCSP (layers 13,16,19,22), Conv → GSConv (layers 17,20)
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26-ghostslim.yaml' will call with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26-GhostSlim backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2 (stem, keep regular Conv)
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4 (stem, keep regular Conv)
  - [-1, 2, C3k2Ghost, [256, False, 0.25]]  # 2
  - [-1, 1, GhostConv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2Ghost, [512, False, 0.25]]  # 4
  - [-1, 1, GhostConv, [512, 3, 2]]     # 5-P4/16
  - [-1, 2, C3k2Ghost, [512, True]]     # 6
  - [-1, 1, GhostConv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 2, C3k2Ghost, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9 (keep SPPF)
  - [-1, 2, C2PSA, [1024]]              # 10 (keep attention)

# YOLO26-GhostSlim head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]           # cat backbone P4
  - [-1, 2, VoVGSCSP, [512, True]]      # 13 (SlimNeck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]           # cat backbone P3
  - [-1, 2, VoVGSCSP, [256, True]]      # 16 (P3/8-small, SlimNeck)

  - [-1, 1, GSConv, [256, 3, 2]]        # 17 (SlimNeck downsampling)
  - [[-1, 13], 1, Concat, [1]]          # cat head P4
  - [-1, 2, VoVGSCSP, [512, True]]      # 19 (P4/16-medium, SlimNeck)

  - [-1, 1, GSConv, [512, 3, 2]]        # 20 (SlimNeck downsampling)
  - [[-1, 10], 1, Concat, [1]]          # cat head P5
  - [-1, 1, VoVGSCSP, [1024, True]]     # 22 (P5/32-large, SlimNeck)

  - [[16, 19, 22], 1, Detect, [nc]]     # Detect(P3, P4, P5)
