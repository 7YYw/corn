# YOLO26-GhostSlim-Diff-LSKA: lightweight detection model with all improvements
# Modifications:
#   1. Backbone: Conv → GhostConv, C3k2 → C3k2Ghost (GhostSlim)
#   2. Neck: C3k2 → VoVGSCSP, Conv → GSConv (SlimNeck)
#   3. C2PSA → C2PSADiff (Differential Attention)
#   4. SPPF → LSKA (Large Separable Kernel Attention)

# Parameters
nc: 80 # number of classes
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2 (stem)
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4 (stem)
  - [-1, 2, C3k2Ghost, [256, False, 0.25]] # 2
  - [-1, 1, GhostConv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2Ghost, [512, False, 0.25]] # 4
  - [-1, 1, GhostConv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2Ghost, [512, True]]        # 6
  - [-1, 1, GhostConv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, C3k2Ghost, [1024, True]]       # 8
  - [-1, 1, LSKA, [1024, 7, 3, True]]      # 9 (SPPF → LSKA)
  - [-1, 2, C2PSADiff, [1024]]             # 10 (C2PSA → C2PSADiff)

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, VoVGSCSP, [512, True]]         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, VoVGSCSP, [256, True]]         # 16 (P3/8-small)

  - [-1, 1, GSConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, VoVGSCSP, [512, True]]         # 19 (P4/16-medium)

  - [-1, 1, GSConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, VoVGSCSP, [1024, True]]        # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]
